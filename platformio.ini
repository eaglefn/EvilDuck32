[env:evilduck32]
platform = espressif32
framework = espidf
board = waveshare_esp32s3_lcd147
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -I"${PROJECT_DIR}"

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults"
